<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Arun Prasath J — Aerospace and Space Systems V&amp;V Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="0.55" stop-color="#14306b"/>
      <stop offset="1" stop-color="#3b1d6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.6" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.6" opacity="0.9"/><circle cx="210" cy="200" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="30" r="1.1" opacity="0.6"/><circle cx="520" cy="225" r="1.4" opacity="0.8"/>
    <circle cx="640" cy="22" r="1.2" opacity="0.7"/><circle cx="760" cy="235" r="1" opacity="0.6"/>
    <circle cx="1150" cy="40" r="1.5" opacity="0.9"/><circle cx="1110" cy="225" r="1.1" opacity="0.6"/>
    <circle cx="40" cy="150" r="1" opacity="0.6"/><circle cx="450" cy="60" r="0.9" opacity="0.5"/>
  </g>

  <!-- planet with orbit, satellite and aircraft -->
  <g transform="translate(985 130)">
    <ellipse rx="150" ry="48" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85" transform="rotate(-18)"/>
    <circle r="62" fill="url(#planet)"/>
    <ellipse rx="62" ry="14" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.35" transform="rotate(-18)"/>
    <!-- satellite -->
    <g transform="translate(118 -78) rotate(-18)">
      <rect x="-9" y="-6" width="18" height="12" rx="2" fill="#e2e8f0"/>
      <rect x="-31" y="-4" width="18" height="8" fill="#38bdf8"/>
      <rect x="13" y="-4" width="18" height="8" fill="#38bdf8"/>
      <line x1="-13" y1="0" x2="-9" y2="0" stroke="#e2e8f0" stroke-width="2"/>
      <line x1="9" y1="0" x2="13" y2="0" stroke="#e2e8f0" stroke-width="2"/>
    </g>
    <!-- aircraft -->
    <g transform="translate(-140 48) rotate(-12)" fill="#f472b6">
      <path d="M-16 0 L14 -2 L20 0 L14 2 Z"/>
      <path d="M0 -1 L-6 -14 L-2 -14 L8 -1 Z"/>
      <path d="M0 1 L-6 14 L-2 14 L8 1 Z"/>
      <path d="M-14 -1 L-18 -7 L-15 -7 L-10 -1 Z"/>
      <path d="M-14 1 L-18 7 L-15 7 L-10 1 Z"/>
    </g>
  </g>

  <!-- text -->
  <text x="60" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Arun Prasath Jeyaraman</text>
  <rect x="60" y="114" width="420" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#bae6fd">Aerospace &amp; Space Systems V&amp;V / IV&amp;V Engineer</text>
  <text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Avionics  •  eVTOL Propulsion  •  Satellite Ground Segment  •  AI for Verification</text>
  <text x="60" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Darmstadt, Germany</text>
</svg>
